<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambiance sonore</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f3ee; --card: #fff; --ink: #1d1b19; --mute: #6b655d; --accent: #d1462f; --line: #e6dfd4; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --card: #222127; --ink: #f1ede6; --mute: #a59d92; --line: #34323a; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin: 0 0 4px; font-size: 26px; }
      h2 { margin: 28px 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
      p.lead { margin: 0 0 8px; color: var(--mute); }
      .row { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
      .row .txt { flex: 1; min-width: 0; }
      .row b { display: block; }
      .row span { color: var(--mute); font-size: 13.5px; }
      button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
      button.play.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
      .bar button.on { background: var(--ink); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <h1>🎧 Ambiance sonore</h1>
      <p class="lead">Tous les sons sont synthétisés en direct (aucun fichier, aucune licence). Clique sur ▶ pour écouter chaque nappe seule, ou lance une scène complète.</p>
      <div class="bar" id="scenes"></div>
      <h2>Nappes d'ambiance</h2>
      <div id="layers"></div>
      <h2>Petits effets</h2>
      <div id="sfx"></div>
    </main>
    <script type="module" src="/src/ambiance-lab.ts"></script>
  </body>
</html>
